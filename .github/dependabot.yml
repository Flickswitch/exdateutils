version: 2

# rustler appears in both ecosystems below -- as a hex dep in mix.exs and as a
# crate in native/exdateutil_rrule. Dependabot cannot group across ecosystems,
# so it will raise two separate PRs. They have to land together: a crate that
# outruns the hex package (or vice versa) breaks source builds.
updates:
  - package-ecosystem: mix
    directory: /
    schedule:
      interval: weekly
    groups:
      mix-production:
        dependency-type: production
        update-types:
          - "minor"
          - "patch"
      mix-dev-test:
        dependency-type: development
        update-types:
          - "minor"
          - "patch"
      mix-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: cargo
    directory: /native/exdateutil_rrule
    schedule:
      interval: weekly
    # Stay on rrule 0.7. chrono-tz must match the version rrule 0.7 uses.
    ignore:
      - dependency-name: "rrule"
        update-types: ["version-update:semver-major"]
      - dependency-name: "chrono-tz"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      cargo-major:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      github-actions-major:
        patterns:
          - "*"
        update-types:
          - "major"
