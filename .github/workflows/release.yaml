name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

jobs:
  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        # rrule.ex sets no nif_versions, so RustlerPrecompiled requests 2.15
        # and nothing else. Artifacts built for any other ABI are never named
        # in the checksum manifest and never downloaded. 2.15 loads on every
        # supported OTP anyway.
        nif: ["2.15"]
        job:
          - {
              target: aarch64-unknown-linux-gnu,
              os: ubuntu-24.04,
              use-cross: true,
            }
          - {
              target: aarch64-unknown-linux-musl,
              os: ubuntu-24.04,
              use-cross: true,
            }
          # macos-13 was retired; these jobs queue forever on it. Both targets
          # build natively: macos-15 is arm64, macos-15-intel is x86_64.
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-24.04 }
          - {
              target: x86_64-unknown-linux-musl,
              os: ubuntu-24.04,
              use-cross: true,
            } 
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Extract project version
        shell: bash
        run: |
          # Get the project version from mix.exs
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.job.target }}

      - name: Build the project
        id: build-crate
        uses: philss/rustler-precompiled-action@v1.0.1
        with:
          project-name: exdateutil_rrule
          project-version: ${{ env.PROJECT_VERSION }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross }}
          project-dir: "native/exdateutil_rrule"

      - name: Artifact upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-crate.outputs.file-name }}
          path: ${{ steps.build-crate.outputs.file-path }}

      - name: Publish archives and packages
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ${{ steps.build-crate.outputs.file-path }}
        if: startsWith(github.ref, 'refs/tags/')

  publish_hex:
    name: Publish to Hex
    needs: build_release
    runs-on: ubuntu-24.04
    # Build the NIF from source: the checksum file is not in the repo, and
    # RustlerPrecompiled refuses to compile without one, so a precompiled
    # build cannot bootstrap itself here. This build is throwaway -- it only
    # exists so the module loads and can be introspected for its NIF URLs.
    env:
      RRULE_BUILD: "1"
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # Keep in sync with .tool-versions
      - name: Install Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.0.1"
          elixir-version: "1.20.1-otp-29"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get

      - run: mix compile

      # Rebuilds checksum-Elixir.ExDateUtil.Rrule.exs from every artifact
      # build_release just attached to this release. Publishing without this
      # ships a partial manifest and the package only installs on the one
      # target that happens to be listed (see v1.1.0).
      - name: Build checksum file for all targets
        run: mix rustler_precompiled.download ExDateUtil.Rrule --all --print

      - name: Configure Flickswitch private hex repo
        run: mix hex.repo list | grep -q '^flickswitch' || mix hex.repo add flickswitch https://hex.flickswitch.cloud/repos/flickswitch --api-url https://hex.flickswitch.cloud/api/repos/flickswitch --public-key flickswitch_hex_public_key.pem

      - name: Publish to hex.pm
        run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

      - name: Publish to Flickswitch private hex repo
        run: mix hex.publish --repo flickswitch --yes
        env:
          HEX_API_KEY: ${{ secrets.FLICKSWITCH_HEX_API_KEY }}
